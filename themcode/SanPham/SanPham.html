<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANH MỤC SẢN PHẨM - TEAM C SỦI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Head_Footer.css">
    <link rel="stylesheet" href="../TrangChu.css"> 
</head>
<body>
    <header class="badhabits-header">
        <div class="header-container">
            <a href="../TrangChu.html" class="logo-box">
                <span class="logo-main">C SỦI</span>
                <span class="logo-sub">OFFICIAL STORE</span>
            </a>
            <nav class="main-nav">
                <a href="../MOST_POPULAR/MOST_POPULAR.html">MOST POPULAR</a>
                <a href="../NEW_ARRIVALS/NEW_ARRIVALS.html">NEW ARRIVALS</a>
                <div class="dropdown">
                    <a href="#">CATALOG <i class="fa-solid fa-chevron-down"></i></a>
                    <div class="dropdown-menu" id="catalogMenu">
                        <a href="#">Đang tải danh mục...</a>
                    </div>
                </div>
                <div class="dropdown">
                    <a href="#">COLLECTION <i class="fa-solid fa-chevron-down"></i></a>
                    <div class="dropdown-menu" id="collectionMenu">
                        <a href="#">Đang tải bộ sưu tập...</a>
                    </div>
                </div>
            </nav>
            <div class="user-actions">
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Tìm kiếm...">
                    <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                <a href="../DangNhap/DangNhap.html" id="authButton">ĐĂNG NHẬP</a>
                <a href="../LichSuDonHang.html" id="historyButton">LỊCH SỬ</a>
                <a href="../GioHang/GioHang.html">GIỎ HÀNG (0)</a>
            </div>
        </div>
    </header>

    <main class="container product-page-main" style="margin-top: 50px;">
        <div class="breadcrumb">
            <a href="../TrangChu.html">TRANG CHỦ</a> / <span id="categoryTitleName">DANH SÁCH SẢN PHẨM</span>
        </div>
        <div class="filter-bar" style="margin-bottom: 20px; font-weight: bold;">
            <i class="fa-solid fa-filter"></i> BỘ LỌC SẢN PHẨM
        </div>
        
        <div class="product-grid" id="dynamicProductGrid">
            <p style="text-align: center; width: 100%; padding: 50px;">Đang tải sản phẩm...</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom container">
            <p>COPYRIGHT © 2026 TEAM C SỦI - LHU. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <script src="../global.js"></script>
    <script>
        async function loadProductsByCategory() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryId = urlParams.get('categoryId');
            const grid = document.getElementById('dynamicProductGrid');

            if (!categoryId) {
                grid.innerHTML = '<p style="text-align:center; width:100%; color: red;">Không tìm thấy mã danh mục hợp lệ trên URL!</p>';
                return;
            }

            try {
                // Lọc sản phẩm theo CategoryId
                const response = await fetch(`https://localhost:7282/api/Products?categoryId=${categoryId}`);
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    grid.innerHTML = ''; 
                    result.data.forEach(product => {
                        const productCard = `
                            <div class="product-card">
                                <div class="product-image">
                                    <a href="../SanPham/ChiTiet.html?id=${product.id}">
                                        <img src="${product.imageUrl}" alt="${product.name}" class="main-img" onerror="this.src='https://via.placeholder.com/300x400?text=No+Image'">
                                    </a>
                                </div>
                                <div class="product-details">
                                    <div class="product-info-left">
                                        <a href="../SanPham/ChiTiet.html?id=${product.id}" style="text-decoration:none; color:inherit;">
                                            <h3 class="product-title">${product.name}</h3>
                                        </a>
                                        <p class="product-price">${product.price.toLocaleString('vi-VN')}đ</p>
                                    </div>
                                    <button class="add-to-cart-btn" onclick="requireLoginForCart('../SanPham/ChiTiet.html?id=${product.id}')"><i class="fa-solid fa-plus"></i></button>
                                </div>
                            </div>
                        `;
                        grid.innerHTML += productCard;
                    });
                } else {
                    grid.innerHTML = '<p style="text-align:center; width: 100%; padding: 50px;">Chưa có sản phẩm nào thuộc danh mục này. Đang chờ Team C Sủi nhập hàng!</p>';
                }
            } catch (error) {
                console.error("Lỗi:", error);
                grid.innerHTML = '<p style="text-align:center; width:100%;">Lỗi kết nối máy chủ C#!</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadProductsByCategory);
    </script>
</body>
</html>
