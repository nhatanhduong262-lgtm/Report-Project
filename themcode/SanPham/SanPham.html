</head>
<body>

            <a href="../TrangChu.html" class="logo-box">

           <nav class="main-nav">

              <div class="dropdown">
                    <a href="#">CATALOG <i class="fa-solid fa-chevron-down"></i></a>
                    <div class="dropdown-menu" id="catalogMenu">
                        <a href="#">Đang tải danh mục...</a>
                    </div>
                </div>
                <div class="dropdown">
                    <a href="#">COLLECTION <i class="fa-solid fa-chevron-down"></i></a>
                    <div class="dropdown-menu" id="collectionMenu">
                        <a href="#">Đang tải bộ sưu tập...</a>
                    </div>
                </div>
                 <div class="dropdown">
                    <a href="#">INFORMATION <i class="fa-solid fa-chevron-down"></i></a>
                    <div class="dropdown-menu" id="collectionMenu">

                    </div>
                </div>    
            </nav>

           <div class="user-actions">
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Tìm kiếm...">
                    <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>

        </div>
    </header>

    <main class="container product-page-main" style="margin-top: 50px;">
        <div class="breadcrumb">
            <a href="../TrangChu.html">TRANG CHỦ</a> / <span id="categoryTitleName">DANH SÁCH SẢN PHẨM</span>
        </div>
        <div class="filter-bar" style="margin-bottom: 20px; font-weight: bold;">
            <i class="fa-solid fa-filter"></i> BỘ LỌC SẢN PHẨM
        </div>
        
        <div class="product-grid" id="dynamicProductGrid">
            <p style="text-align: center; width: 100%; padding: 50px;">Đang tải sản phẩm...</p>
        </div>
    </main>

            <p>COPYRIGHT © 2026 TEAM C SỦI - LHU. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <script src="../global.js"></script>
    <script>
        async function loadProducts() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryId = urlParams.get('categoryId');
            const searchQuery = urlParams.get('search'); // Lấy từ khóa tìm kiếm
            
            const grid = document.getElementById('dynamicProductGrid');
            const titleName = document.getElementById('categoryTitleName');

            try {
                // Tạm thời gọi API lấy TẤT CẢ sản phẩm về
                const response = await fetch(`https://localhost:7282/api/Products`);
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    let filteredProducts = result.data;

                    // Nếu khách đang dùng thanh TÌM KIẾM
                    if (searchQuery) {
                        titleName.textContent = `KẾT QUẢ TÌM KIẾM: "${searchQuery.toUpperCase()}"`;
                        // Lọc mảng bằng JavaScript (Tìm theo tên áo)
                        filteredProducts = filteredProducts.filter(p => 
                            p.name.toLowerCase().includes(searchQuery.toLowerCase())
                        );
                    } 
                    // Nếu khách đang bấm MENU DANH MỤC
                    else if (categoryId) {
                        titleName.textContent = `DANH MỤC SẢN PHẨM`;
                        filteredProducts = filteredProducts.filter(p => p.categoryId == categoryId);
                    }

                    // Render ra giao diện
                    if (filteredProducts.length > 0) {
                        grid.innerHTML = ''; 
                        filteredProducts.forEach(product => {
                            grid.innerHTML += `
                                <div class="product-card">
                                    <div class="product-image">
                                        <a href="../SanPham/ChiTiet.html?id=${product.id}">
                                            <img src="${product.imageUrl}" class="main-img" onerror="this.src='https://via.placeholder.com/300x400'">
                                        </a>
                                    </div>
                                    <div class="product-details">
                                        <div class="product-info-left">
                                            <h3 class="product-title">${product.name}</h3>
                                            <p class="product-price">${product.price.toLocaleString('vi-VN')}đ</p>
                                        </div>
                                        <button class="add-to-cart-btn" onclick="requireLoginForCart('../SanPham/ChiTiet.html?id=${product.id}')"><i class="fa-solid fa-plus"></i></button>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        grid.innerHTML = '<p style="text-align:center; width:100%; padding:50px;">Không tìm thấy sản phẩm nào phù hợp!</p>';
                    }
                }
            } catch (error) {
                grid.innerHTML = '<p style="text-align:center; width:100%;">Lỗi kết nối máy chủ!</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
