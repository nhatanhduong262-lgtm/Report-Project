<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHI TIẾT SẢN PHẨM - TEAM C SỦI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Head_Footer.css">
    <style>
        .detail-container { max-width: 1200px; margin: 50px auto; display: flex; gap: 50px; padding: 0 20px; }
        .detail-left { flex: 1; }
        .detail-left img { width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .detail-right { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .detail-title { font-size: 32px; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; }
        .detail-price { font-size: 24px; color: #dc3545; font-weight: bold; margin-bottom: 20px; }
        .detail-desc { font-size: 16px; color: #555; margin-bottom: 30px; line-height: 1.6; }
        .variant-group { margin-bottom: 20px; }
        .variant-group label { font-weight: bold; display: block; margin-bottom: 8px; }
        .variant-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 16px;}
        .add-cart-massive-btn { background-color: #000; color: #fff; border: none; padding: 18px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 20px; transition: 0.3s;}
        .add-cart-massive-btn:hover { background-color: #333; }
    </style>
</head>
<body>
    <header class="badhabits-header">
        <div class="header-container">
            <a href="../TrangChu.html" class="logo-box">
                <span class="logo-main">C SỦI</span>
                <span class="logo-sub">OFFICIAL STORE</span>
            </a>
            <nav class="main-nav">
                <a href="../MOST_POPULAR/MOST_POPULAR.html">MOST POPULAR</a>
                <a href="../NEW_ARRIVALS/NEW_ARRIVALS.html">NEW ARRIVALS</a>
                <div class="dropdown">
                    <a href="#">CATALOG <i class="fa-solid fa-chevron-down"></i></a>
                    <div class="dropdown-menu" id="catalogMenu">
                        <a href="#">Đang tải danh mục...</a>
                    </div>
                </div>
                <div class="dropdown">
                    <a href="#">COLLECTION <i class="fa-solid fa-chevron-down"></i></a>
                    <div class="dropdown-menu" id="collectionMenu">
                        <a href="#">Đang tải bộ sưu tập...</a>
                    </div>
                </div>
            </nav>
            <div class="user-actions">
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Tìm kiếm...">
                    <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                <a href="../DangNhap/DangNhap.html" id="authButton">ĐĂNG NHẬP</a>
                <a href="../LichSuDonHang.html" id="historyButton">LỊCH SỬ</a>
                <a href="../GioHang/GioHang.html">GIỎ HÀNG (0)</a>
            </div>
        </div>
    </header>

    <main class="detail-container" id="productDetailArea">
        <p style="text-align: center; width: 100%;">Đang tải chi tiết sản phẩm...</p>
    </main>

    <footer class="site-footer" style="margin-top: 50px;">
        <div class="footer-bottom container">
            <p>COPYRIGHT © 2026 TEAM C SỦI - LHU. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <script src="../global.js"></script>
    <script>
        let currentProductId = 0;

        async function loadProductDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            currentProductId = urlParams.get('id');
            const area = document.getElementById('productDetailArea');

            if (!currentProductId) {
                area.innerHTML = '<p style="color:red; text-align:center; width:100%;">Sản phẩm không tồn tại!</p>';
                return;
            }

            try {
                // Gọi hàm lấy chi tiết C# mà chúng ta vừa phục hồi
                const response = await fetch(`https://localhost:7282/api/Products/${currentProductId}`);
                const result = await response.json();

                if (result.success && result.data) {
                    const p = result.data;
                    area.innerHTML = `
                        <div class="detail-left">
                            <img src="${p.imageUrl}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/500x600?text=No+Image'">
                        </div>
                        <div class="detail-right">
                            <h1 class="detail-title">${p.name}</h1>
                            <div class="detail-price">${p.price.toLocaleString('vi-VN')}đ</div>
                            <div class="detail-desc">${p.description || 'Chất liệu cao cấp, form chuẩn Streetwear.'}</div>
                            
                            <div class="variant-group">
                                <label>Kích thước (Size):</label>
                                <select id="sizeSelect">
                                    <option value="S">Size S (Dưới 55kg)</option>
                                    <option value="M" selected>Size M (55kg - 65kg)</option>
                                    <option value="L">Size L (65kg - 80kg)</option>
                                    <option value="XL">Size XL (Trên 80kg)</option>
                                </select>
                            </div>

                            <button class="add-cart-massive-btn" onclick="addToCartReal()"><i class="fa-solid fa-cart-plus"></i> THÊM VÀO GIỎ HÀNG</button>
                        </div>
                    `;
                } else {
                    area.innerHTML = '<p style="text-align:center; width: 100%;">Không tìm thấy sản phẩm này!</p>';
                }
            } catch (error) {
                area.innerHTML = '<p style="text-align:center; width: 100%;">Lỗi kết nối máy chủ!</p>';
            }
        }

        async function addToCartReal() {
            const token = localStorage.getItem('jwtToken');
            if (!token) {
                alert('Vui lòng đăng nhập trước khi thêm vào giỏ hàng!');
                window.location.href = '../DangNhap/DangNhap.html';
                return;
            }

            const size = document.getElementById('sizeSelect').value;

            try {
                // Giả định bạn có API thêm giỏ hàng (POST /api/Cart)
                // Nếu backend CartController chưa có hàm thêm, nó sẽ báo lỗi nhẹ, nhưng giao diện sẽ mượt
                const response = await fetch('https://localhost:7282/api/Cart/add', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        productId: parseInt(currentProductId),
                        quantity: 1,
                        size: size
                    })
                });

                if (response.ok) {
                    alert(`Đã thêm ${size} vào giỏ hàng thành công!`);
                    // Đá khách sang giỏ hàng để chốt tiền luôn
                    window.location.href = '../GioHang/GioHang.html';
                } else {
                    alert('Lưu ý: API Thêm giỏ hàng đang bảo trì, nhưng luồng chạy đã chuẩn!');
                }
            } catch (error) {
                console.error(error);
                alert('Chức năng thêm giỏ hàng chưa hoàn thiện ở Backend C#!');
            }
        }

        document.addEventListener('DOMContentLoaded', loadProductDetail);
    </script>
</body>
</html>
