<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LỊCH SỬ ĐƠN HÀNG - TEAM C SỦI</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./Head_Footer.css">
    
    <style>
        .history-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            min-height: 50vh;
        }
        .history-title {
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .order-table th, .order-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .order-table th {
            background-color: #000;
            color: #fff;
            text-transform: uppercase;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            background-color: #28a745; /* Màu xanh lá cho thành công */
            color: white;
        }
    </style>
</head>

<body>
    <header class="badhabits-header">
        <div class="header-container">
            <a href="./TrangChu.html" class="logo-box">
                <span class="logo-main">C SỦI</span>
                <span class="logo-sub">OFFICIAL STORE</span>
            </a>
            <nav class="main-nav">
                <a href="./MOST_POPULAR/MOST_POPULAR.html">MOST POPULAR</a>
                <a href="./NEW_ARRIVALS/NEW_ARRIVALS.html">NEW ARRIVALS</a>
                <div class="dropdown">
                    <a href="#">CATALOG <i class="fa-solid fa-chevron-down"></i></a>
                    <div class="dropdown-menu" id="catalogMenu">
                        <a href="#">Đang tải danh mục...</a>
                    </div>
                </div>
                <div class="dropdown">
                    <a href="#">COLLECTION <i class="fa-solid fa-chevron-down"></i></a>
                    <div class="dropdown-menu" id="collectionMenu">
                        <a href="#">Đang tải bộ sưu tập...</a>
                    </div>
                </div>
            </nav>
            <div class="user-actions">
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Tìm kiếm...">
                    <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                <a href="./DangNhap/DangNhap.html" id="authButton">ĐĂNG NHẬP</a>
                <a href="./LichSuDonHang.html" id="historyButton">LỊCH SỬ</a>
                <a href="./GioHang/GioHang.html">GIỎ HÀNG (0)</a>
            </div>
        </div>
    </header>

    <main class="history-container">
        <h2 class="history-title">LỊCH SỬ MUA HÀNG CỦA BẠN</h2>
        <div id="orderContent">
            <p style="text-align: center;">Đang tải dữ liệu...</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom container">
            <p>COPYRIGHT © 2026 TEAM C SỦI - LHU. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <script src="./global.js"></script>
    <script>
        async function loadOrderHistory() {
            const token = localStorage.getItem('jwtToken');
            const contentDiv = document.getElementById('orderContent');

            if (!token) {
                contentDiv.innerHTML = '<p style="text-align:center; color: red; font-weight: bold;">Vui lòng ĐĂNG NHẬP để xem lịch sử đơn hàng!</p>';
                return;
            }

            try {
                // Gọi API lấy lịch sử (kèm Token bảo mật)
                const response = await fetch('https://localhost:7282/api/Orders', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    
                    if (result.success && result.data.length > 0) {
                        let tableHTML = `
                            <table class="order-table">
                                <thead>
                                    <tr>
                                        <th>Mã Đơn</th>
                                        <th>Ngày Đặt</th>
                                        <th>Tổng Tiền</th>
                                        <th>Trạng Thái</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;
                        
                        result.data.forEach(order => {
                            // Giả sử API trả về orderDate và totalAmount
                            const date = new Date(order.orderDate || Date.now()).toLocaleDateString('vi-VN');
                            const total = (order.totalAmount || 0).toLocaleString('vi-VN');
                            
                            tableHTML += `
                                <tr>
                                    <td><strong>#ORD-${order.id}</strong></td>
                                    <td>${date}</td>
                                    <td>${total}đ</td>
                                    <td><span class="status-badge">Hoàn Tất</span></td>
                                </tr>
                            `;
                        });
                        
                        tableHTML += `</tbody></table>`;
                        contentDiv.innerHTML = tableHTML;
                    } else {
                        contentDiv.innerHTML = '<p style="text-align:center;">Bạn chưa có đơn hàng nào. Hãy shopping thôi!</p>';
                    }
                } else {
                    contentDiv.innerHTML = '<p style="text-align:center; color: red;">Phiên đăng nhập hết hạn hoặc lỗi máy chủ.</p>';
                }
            } catch (error) {
                console.error('Lỗi:', error);
                contentDiv.innerHTML = '<p style="text-align:center;">Lỗi kết nối đến Server!</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadOrderHistory);
    </script>
</body>
</html>
